name: Build and deploy ATLAS
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Read the repository Pages path
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run audit:publish
      - run: npm run typecheck
      - run: npm test
      - name: Build production PWA
        run: npm run build
        env:
          ATLAS_PAGES_BUILD: 'true'
          # Pages metadata derives the path from the repository, no username in source.
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GEOAPIFY_API_KEY: ${{ secrets.VITE_GEOAPIFY_API_KEY }}
          VITE_MAP_STYLE_URL: ${{ vars.VITE_MAP_STYLE_URL }}
      - name: Verify paths, PWA files and public artifact
        run: npm run check:pages
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
